name: Etiquetage automatique des tickets

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  etiquetage:
    runs-on: ubuntu-latest
    steps:
      - name: Etiqueter selon la source Alter
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToRemove = [
              'source:cli',
              'source:mcp',
              'source:desktop',
            ];
            const labelMap = {
              'Alter CLI': 'source:cli',
              'Alter MCP': 'source:mcp',
              'Alter Desktop': 'source:desktop',
            };
            const issue = context.payload.issue;
            if (!issue) {
              return;
            }

            const lines = issue.body ? issue.body.split('\n') : [];
            const sourceValueLineIndex = lines.findIndex((line) =>
              line.startsWith('### Source Alter'),
            );

            if (sourceValueLineIndex < 0) {
              return;
            }

            const sourceValue = lines[sourceValueLineIndex + 2]?.trim();
            const labelToAdd = labelMap[sourceValue];
            if (!labelToAdd) {
              return;
            }

            const existingLabels = issue.labels.map((label) => label.name);
            const remove = labelsToRemove.filter((label) => existingLabels.includes(label));
            if (remove.length) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: remove[0],
              }).catch(() => {});
            }

            if (!existingLabels.includes(labelToAdd)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [labelToAdd],
              });
            }
