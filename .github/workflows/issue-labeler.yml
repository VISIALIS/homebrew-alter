name: Etiquetage automatique des tickets

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  etiquetage:
    runs-on: ubuntu-latest
    steps:
      - name: Etiqueter selon la source Alter
        uses: actions/github-script@v7
        with:
          script: |
            const sourceLabelsToRemove = [
              'source:cli',
              'source:mcp',
              'source:desktop',
            ];
            const labelMap = {
              'Alter CLI': 'source:cli',
              'Alter MCP': 'source:mcp',
              'Alter Desktop': 'source:desktop',
            };
            const typeLabelsToRemove = [
              'type:anomalie',
              'type:demande',
              'type:documentation',
              'type:installation',
              'type:retour',
            ];
            const typePrefixMap = {
              '[Anomalie]': 'type:anomalie',
              '[Demande]': 'type:demande',
              '[Documentation]': 'type:documentation',
              '[Installation]': 'type:installation',
              '[Retour]': 'type:retour',
            };
            const issue = context.payload.issue;
            if (!issue) {
              return;
            }

            const existingLabels = issue.labels.map((label) => label.name);

            const lines = issue.body ? issue.body.split('\n') : [];
            const sourceValueLineIndex = lines.findIndex((line) =>
              line.startsWith('### Source Alter'),
            );

            if (sourceValueLineIndex >= 0) {
              const sourceValue = lines[sourceValueLineIndex + 2]?.trim();
              const labelToAdd = labelMap[sourceValue];
              if (labelToAdd) {
                for (const label of sourceLabelsToRemove) {
                  if (existingLabels.includes(label)) {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: label,
                    }).catch(() => {});
                  }
                }
                if (!existingLabels.includes(labelToAdd)) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: [labelToAdd],
                  });
                }
              }
            }

            const title = issue.title ?? '';
            const typeEntry = Object.entries(typePrefixMap).find(([prefix]) =>
              title.startsWith(prefix),
            );
            if (typeEntry) {
              const labelToAdd = typeEntry[1];
              for (const label of typeLabelsToRemove) {
                if (existingLabels.includes(label)) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: label,
                  }).catch(() => {});
                }
              }
              if (!existingLabels.includes(labelToAdd)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: [labelToAdd],
                });
              }
            }
